<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ICARUS: the cursor and its swarm on a tile. Comic edition: ink lines,
       flat bright fills, a halftone corner and one hard shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#4a2bc2"/>
    </linearGradient>
    <linearGradient id="cur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0c4"/>
    </linearGradient>
    <pattern id="dots" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="1.3" cy="1.3" r="0.62" fill="#ffffff"/>
    </pattern>
    <radialGradient id="fade" cx="1" cy="1" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="corner"><rect width="32" height="32" fill="url(#fade)"/></mask>
    <clipPath id="clip"><rect x="1" y="1" width="30" height="30" rx="9"/></clipPath>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect width="32" height="32" fill="url(#dots)" mask="url(#corner)"/>
    <path d="M1 12C6 6 13 3.2 22 2.4L1 1z" fill="#ffffff" opacity="0.2"/>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="none" stroke="#0b0814" stroke-width="1.8"/>
  <g stroke="#0b0814" stroke-width="1.1">
    <circle cx="16.6" cy="26.2" r="1.9" fill="#2fa4ff"/>
    <circle cx="20.6" cy="24.6" r="1.9" fill="#ff4f8b"/>
    <circle cx="23.8" cy="21.8" r="1.9" fill="#ffc83d"/>
    <circle cx="25.8" cy="18.1" r="1.9" fill="#45ed53"/>
  </g>
  <path d="M9.4 6.8v15.1l4.2-3.6 2.8 6 2.9-1.4-2.8-5.8h5.8z" fill="#0b0814" stroke="#0b0814" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M8.2 5.6v15.1l4.2-3.6 2.8 6 2.9-1.4-2.8-5.8h5.8z" fill="url(#cur)" stroke="#0b0814" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9.9 8.8v5.4" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
</svg>
